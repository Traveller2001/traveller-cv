# Editorial palette; layout and typography are defined in custom.scss.
name = "Editorial"

[light]
  primary = "#245dac"
  link = "#245dac"
  link_hover = "#18222d"
  menu_primary = "#ffffff"
  menu_text = "#606b77"
  menu_text_active = "#245dac"
  menu_title = "#18222d"
  home_section_odd = "#ffffff"
  home_section_even = "#ffffff"

[dark]
  primary = "#97bff3"
  link = "#97bff3"
  link_hover = "#e9edf2"
  menu_primary = "#171c23"
  menu_text = "#a6b0bd"
  menu_text_active = "#e9edf2"
  menu_title = "#e9edf2"
  home_section_odd = "#171c23"
  home_section_even = "#171c23"
