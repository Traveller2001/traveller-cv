# Monochrome palette with one ultramarine accent; layout and type live in assets/scss/custom.scss.
name = "Ink"

[light]
  primary = "#2a43ad"
  link = "#15181d"
  link_hover = "#2a43ad"
  menu_primary = "#ffffff"
  menu_text = "#6b717c"
  menu_text_active = "#15181d"
  menu_title = "#15181d"
  home_section_odd = "#ffffff"
  home_section_even = "#ffffff"

[dark]
  primary = "#a6b6ff"
  link = "#eceef2"
  link_hover = "#a6b6ff"
  menu_primary = "#0f1216"
  menu_text = "#8b93a0"
  menu_text_active = "#eceef2"
  menu_title = "#eceef2"
  home_section_odd = "#0f1216"
  home_section_even = "#0f1216"
