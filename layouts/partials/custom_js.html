<script>
// The theme's hover dropdown races with Bootstrap's click handler.
// Keep this menu click-operated so it also works with touch and keyboard.
document.querySelectorAll('.theme-dropdown').forEach(function (menu) {
  menu.classList.remove('dropdown');
});

// Give the navbar a hairline only once the page has scrolled under it.
(function () {
  var nav = document.getElementById('navbar-main');
  if (!nav) return;
  var update = function () { nav.classList.toggle('is-scrolled', window.scrollY > 8); };
  update();
  window.addEventListener('scroll', update, { passive: true });
})();
</script>
